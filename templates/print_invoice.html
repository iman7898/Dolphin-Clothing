<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>چاپ فاکتور</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>*{font-family:'Vazirmatn',Tahoma;font-size:12px;margin:0;padding:0}body{background:#fff;color:#000;padding:10px;text-align:right}.header{text-align:center;margin-bottom:15px;border-bottom:1px dashed #000;padding-bottom:10px}.item{display:flex;justify-content:space-between;margin-bottom:5px}.total{margin-top:15px;border-top:1px dashed #000;padding-top:10px;font-weight:bold}</style></head><body onload="window.print()">
<div class="header"><h2>فروشگاه دلفین</h2><p>فاکتور شماره: {{ inv.id }}</p><p>تاریخ: {{ inv.date }}</p><p>طرف حساب: {{ inv.cp_name }}</p></div>
<div>{% for item in items %}<div class="item"><span>{{ item.name }}</span><span>{{ item.quantity }}x</span><span>{{ "{:,}".format(item.unit_price * item.quantity) }}</span></div>{% endfor %}</div>
<div class="total"><div class="item"><span>جمع کل:</span><span>{{ "{:,}".format(inv.total_amount) }} تومان</span></div></div>
</body></html>
