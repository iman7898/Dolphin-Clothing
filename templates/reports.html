{% extends 'base.html' %}{% block content %}
<div class="card"><div class="card-title">📊 گزارش فروش کالاها</div>
<table style="width:100%;text-align:right;font-size:14px">
<tr style="color:#00d4ff;border-bottom:1px solid #1a5276"><th>نام کالا</th><th>تعداد</th><th>مبلغ</th></tr>
{% for item in sales %}<tr style="border-bottom:1px dashed #1a5276"><td style="padding:10px 0">{{ item.name }}</td><td style="color:#00ff88">{{ item.qty }}</td><td style="color:#ffd700">{{ "{:,}".format(item.total) }}</td></tr>{% endfor %}
</table></div>
{% endblock %}
