{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-title">📒 ثبت سند دستی (حساب کتاب)</div>
    <form method="POST">
        <div class="form-group"><label>شرح</label><input type="text" name="description" required></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>حساب بدهکار</label>
                <select name="debit_account" required>
                    {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>حساب بستانکار</label>
                <select name="credit_account" required>
                    {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group"><label>مبلغ (تومان)</label><input type="number" name="amount" required></div>
        <button type="submit" class="btn btn-gold">ثبت سند</button>
    </form>
</div>

<div class="card">
    <div class="card-title">📋 گردش حساب‌ها (۵۰ تراکنش آخر)</div>
    <table style="width: 100%; text-align: right; font-size: 13px;">
        <tr style="color: #00d4ff; border-bottom: 1px solid #1a5276;">
            <th>تاریخ</th><th>شرح</th><th>بدهکار</th><th>بستانکار</th><th>مبلغ</th>
        </tr>
        {% for l in ledger %}
        <tr style="border-bottom: 1px dashed #1a5276;">
            <td style="padding: 8px 0;">{{ l.date[:10] }}</td>
            <td>{{ l.description }}</td>
            <td style="color: #00ff88;">{{ l.debit_name }}</td>
            <td style="color: #ff4d4d;">{{ l.credit_name }}</td>
            <td>{{ "{:,}".format(l.amount) }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
