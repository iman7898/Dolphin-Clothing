{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-title">➕ ثبت طرف حساب جدید</div>
    <form method="POST">
        <div class="form-group"><label>نام</label><input type="text" name="name" required></div>
        <div class="form-group"><label>شماره تماس</label><input type="text" name="phone"></div>
        <div class="form-group">
            <label>نوع طرف حساب</label>
            <select name="type">
                <option value="customer">مشتری</option>
                <option value="supplier">تامین کننده</option>
            </select>
        </div>
        <button type="submit" class="btn btn-blue">ثبت طرف حساب</button>
    </form>
</div>

<div class="card">
    <div class="card-title">👥 لیست طرف حساب‌ها</div>
    <table style="width: 100%; text-align: right; font-size: 14px;">
        <tr style="color: #00d4ff; border-bottom: 1px solid #1a5276;">
            <th>نام</th><th>نوع</th><th>تلفن</th>
        </tr>
        {% for c in counterparties %}
        <tr style="border-bottom: 1px dashed #1a5276; padding: 10px;">
            <td style="padding: 10px 0;">{{ c.name }}</td>
            <td>{{ 'مشتری' if c.type == 'customer' else 'تامین‌کننده' }}</td>
            <td>{{ c.phone }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
