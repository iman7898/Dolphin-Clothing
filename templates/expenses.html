{% extends 'base.html' %}{% block content %}
<div class="card"><div class="card-title">💸 ثبت هزینه جدید</div>
<form method="POST">
<div class="form-group"><label>عنوان هزینه</label><input type="text" name="title" placeholder="مثلاً اجاره مغازه" required></div>
<div class="form-group"><label>مبلغ (تومان)</label><input type="number" name="amount" required></div>
<button type="submit" class="btn btn-red">ثبت هزینه (کسر از صندوق)</button>
</form></div>
<div class="card"><div class="card-title">📋 لیست هزینه‌ها</div>
<table style="width:100%;text-align:right;font-size:14px">
<tr style="color:#00d4ff;border-bottom:1px solid #1a5276"><th>عنوان</th><th>مبلغ</th><th>تاریخ</th></tr>
{% for e in expenses %}
<tr style="border-bottom:1px dashed #1a5276"><td style="padding:8px 0">{{ e.title }}</td><td style="color:#ff4d4d">{{ "{:,}".format(e.amount) }}</td><td style="color:#a0c4ff;font-size:12px">{{ e.date }}</td></tr>
{% endfor %}
</table></div>
{% endblock %}
